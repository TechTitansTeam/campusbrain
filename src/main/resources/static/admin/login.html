<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – CampusBrain</title>
  <script>
    // Direct Access: Redirect immediately to Upload & Management Console
    window.location.replace('/admin');
  </script>
  <style>
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg-main: #0B0F19;
      --bg-surface: #111827;
      --bg-surface-elevated: #1F2937;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --text-primary: #F9FAFB;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      --accent-emerald: #10B981;
      --accent-rose: #F43F5E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-main);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    .bg-mesh {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%),
        var(--bg-main);
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px auto;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .brand-icon svg {
      width: 30px;
      height: 30px;
      color: #FFFFFF;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .form-input {
      width: 100%;
      background-color: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 14px 12px 42px;
      color: var(--text-primary);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .password-toggle-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .password-toggle-btn:hover {
      color: var(--text-primary);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .alert-error {
      background-color: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #FB7185;
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366F1, #4F46E5);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #4F46E5, #4338CA);
      box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .demo-creds-box {
      margin-top: 24px;
      padding: 14px 16px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--border-subtle);
      border-radius: 10px;
      font-size: 0.82rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-creds-btn {
      background-color: var(--bg-surface-elevated);
      color: #A5B4FC;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .demo-creds-btn:hover {
      background-color: rgba(99, 102, 241, 0.2);
      color: #FFFFFF;
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-icon">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h1 class="brand-title">Admin Console</h1>
        <p class="brand-subtitle">CampusBrain Secure Management Portal</p>
      </div>

      <div class="alert alert-error" id="errorAlert">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span id="errorMessage">Invalid credentials</span>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usernameInput" class="form-label">Administrator Username</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <input 
              type="text" 
              id="usernameInput" 
              class="form-input" 
              placeholder="Enter admin username" 
              required 
              autocomplete="username"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
            <input 
              type="password" 
              id="passwordInput" 
              class="form-input" 
              placeholder="Enter password" 
              required 
              autocomplete="current-password"
            />
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" title="Toggle password visibility">
              <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">
          <div class="spinner" id="spinner"></div>
          <span id="btnText">Sign In to Admin Console</span>
        </button>
      </form>

      <div class="demo-creds-box">
        <div>
          <span>Default Credentials:</span><br>
          <strong style="color: #F3F4F6;">admin</strong> / <strong style="color: #F3F4F6;">admin123</strong>
        </div>
        <button type="button" class="demo-creds-btn" id="fillDemoBtn">Auto Fill</button>
      </div>

    </div>
  </div>

  <script>
    (function () {
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');
      const fillDemoBtn = document.getElementById('fillDemoBtn');

      // Auto-fill demo button
      if (fillDemoBtn) {
        fillDemoBtn.addEventListener('click', () => {
          usernameInput.value = 'admin';
          passwordInput.value = 'admin123';
        });
      }

      // Password visibility toggle
      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
        });
      }

      // Form submission
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorAlert.style.display = 'none';

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        if (!username || !password) return;

        submitBtn.disabled = true;
        spinner.style.display = 'block';
        btnText.textContent = 'Verifying credentials...';

        try {
          const res = await fetch('/api/admin/auth/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || 'Authentication failed. Please verify credentials.');
          }

          // Store authentication session
          localStorage.setItem('campusbrain_admin_token', data.token);
          localStorage.setItem('campusbrain_admin_user', JSON.stringify({
            username: data.username,
            fullName: data.fullName,
            email: data.email
          }));

          btnText.textContent = 'Success! Redirecting...';
          window.location.href = '/admin';
        } catch (err) {
          errorMessage.textContent = err.message || 'Login failed';
          errorAlert.style.display = 'flex';
          submitBtn.disabled = false;
          spinner.style.display = 'none';
          btnText.textContent = 'Sign In to Admin Console';
        }
      });
    })();
  </script>
</body>
</html>
