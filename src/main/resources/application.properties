spring.application.name=campusbrain
server.port=${PORT:8080}

# File Upload configuration (allowing up to 100MB academic files)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Uploads directory
app.upload.dir=./uploads

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Default MySQL configuration (can be overridden via environment variables)
spring.datasource.url=jdbc:mysql://localhost:3306/campusbrain?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

logging.level.com.campusbrain=INFO
